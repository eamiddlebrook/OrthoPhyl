# Pinned export (`conda env export -n viral_annot`) of the env used by
# --annotator viral (NCBI VADR + VIGOR4 fallback). Kept SEPARATE from
# orthophyl_env.2.2.1.yml on purpose: VADR pins its own infernal/hmmer/blast
# versions, different from the main env's -- installing vadr directly into
# the shared orthophyl env is conda-resolvable but touches those shared
# package versions (same leak class as the earlier ReLeaf/mafft container
# env-leak incident). Tools from this env are reached only via
# control_file.paths' viral_env_run command prefix, never put on PATH
# alongside the main env.
#
# Recreate with: mamba env create -n viral_annot -f orthophyl_viral_env.yml
#
# VIGOR4 itself is NOT a conda package (confirmed: no bioconda/conda-forge
# "vigor*" package exists) and is therefore NOT listed below. After creating
# this env, build/install it manually from the public JCVenterInstitute repos
# and expose it on this env's PATH:
#   git clone https://github.com/JCVenterInstitute/VIGOR4.git && cd VIGOR4 && mvn package
#   -> unpack the resulting target/vigor-<version>/ release layout
#      (bin/vigor4 launcher, lib/*.jar, config/vigor.ini) to
#      $CONDA_PREFIX/opt/vigor4, then:
#        ln -s $CONDA_PREFIX/opt/vigor4/bin/vigor4 $CONDA_PREFIX/bin/vigor4
#   git clone https://github.com/JCVenterInstitute/VIGOR_DB.git
#      -> a reference-database clone (Reference_DBs/*_db + *_db.ini per virus
#         family); point --vigor-db-dir at its Reference_DBs/ at runtime, or
#         persist a copy under $CONDA_PREFIX/opt/VIGOR_DB for convenience.
# vigor4's bin/vigor4 launcher is self-locating (finds its own lib/*.jar and
# config/vigor.ini relative to its own path) and only needs `java` +
# `exonerate_path` resolvable -- both already in this env.
