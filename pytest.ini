[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: tests that are network-dependent or long-running (deselect with '-m "not slow"')
    integration: tests that exercise multiple components together
addopts = -ra --tb=short

# Container-aware temporary directory handling
# pytest will use these in order of preference:
# 1. PYTEST_TMP_DIR environment variable (explicit override)
# 2. Standard tempfile.gettempdir() (respects TMPDIR, TMP, TEMP)
# 3. .pytest_tmp in current directory (fallback for read-only /tmp)
#
# For Singularity containers with read-only /tmp, set:
#   export PYTEST_TMP_DIR=/path/to/writable/dir
# or:
#   export TMPDIR=/path/to/writable/dir
